<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Suspended - Botanical Hearth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Libre Caslon Text"', 'serif'],
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
          colors: {
            'bg-herb-white': '#F3F6EE',
            'surface-paper': '#FDFBF6',
            'primary-moss': '#2F5233',
            'primary-moss-hover': '#25401F',
            'accent-beetroot': '#A63446',
            'accent-turmeric': '#D9A441',
            'text-charcoal': '#2B2A25',
            'text-stem-gray': '#6B6F63',
            'border-sage-mist': '#DCE3D5',
            'error-chili': '#C1432E',
            'error-chili-bg': '#FDF2F0',
            'success-sprout': '#4C8C4A',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #F3F6EE;
      color: #2B2A25;
      -webkit-font-smoothing: antialiased;
    }
    .font-caslon {
      font-family: 'Libre Caslon Text', serif;
    }
  </style>
</head>
<body class="min-h-screen bg-bg-herb-white flex flex-col items-center justify-center p-4 sm:p-6 select-none relative overflow-hidden">
  <!-- Subtle organic background watermark elements consistent with Botanical Hearth -->
  <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-[#EAEFE5] opacity-50 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-[#E5ECE0] opacity-40 blur-3xl pointer-events-none"></div>

  <!-- Minimal Brand Header Indicator for Context (No Navbar) -->
  <div class="mb-8 flex items-center gap-2.5 opacity-90">
    <div class="w-8 h-8 rounded-full bg-primary-moss/10 flex items-center justify-center text-primary-moss border border-primary-moss/20">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12a10 10 0 0 1 10-10z"></path>
        <path d="M12 6c-2.5 3-4 6-4 8a4 4 0 0 0 8 0c0-2-1.5-5-4-8z"></path>
      </svg>
    </div>
    <span class="font-caslon text-lg font-bold text-text-charcoal tracking-tight">Botanical Hearth</span>
  </div>

  <!-- Warning Card -->
  <main class="w-full max-w-[460px] bg-surface-paper border border-border-sage-mist rounded-xl shadow-none p-8 sm:p-10 flex flex-col items-center text-center relative z-10">
    <!-- Icon Container -->
    <div class="w-16 h-16 rounded-full bg-error-chili-bg flex items-center justify-center mb-6 border border-error-chili/20">
      <svg class="w-8 h-8 text-error-chili" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        <circle cx="12" cy="16" r="1.25" fill="currentColor"></circle>
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="font-caslon text-2xl sm:text-[28px] leading-tight font-normal text-text-charcoal mb-3">
      Account Suspended
    </h1>

    <!-- Primary Notice Message -->
    <p class="text-sm sm:text-[15px] leading-relaxed text-text-charcoal max-w-[340px] mb-4">
      Your account has been restricted due to a violation of our community standards.
    </p>

    <!-- Reference Details / Timestamp Box -->
    <div class="w-full bg-bg-herb-white/80 border border-border-sage-mist/80 rounded-lg py-2.5 px-4 mb-8 text-left">
      <div class="flex items-center justify-between text-xs text-text-stem-gray">
        <span>Restriction ID:</span>
        <span class="font-mono text-text-charcoal font-medium">#SUSP-84920</span>
      </div>
      <div class="flex items-center justify-between text-xs text-text-stem-gray mt-1">
        <span>Effective Date:</span>
        <span class="text-text-charcoal">March 29, 2025</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="w-full flex flex-col gap-3">
      <!-- Primary: Contact Support -->
      <a href="mailto:support@botanicalhearth.com" class="w-full py-3 px-4 bg-primary-moss hover:bg-primary-moss-hover text-white text-sm font-medium rounded-lg transition-colors duration-150 flex items-center justify-center gap-2 text-center">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Contact Support</span>
      </a>

      <!-- Secondary: Log Out -->
      <button type="button" class="w-full py-2.5 px-4 bg-transparent hover:bg-bg-herb-white border-[1.5px] border-border-sage-mist text-text-stem-gray hover:text-text-charcoal text-sm font-medium rounded-lg transition-colors duration-150 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Log Out</span>
      </button>
    </div>

    <!-- Additional Help Text -->
    <p class="mt-6 text-xs text-text-stem-gray leading-normal">
      If you believe this suspension was made in error, please submit an appeal via support.
    </p>
  </main>

</body></html>
