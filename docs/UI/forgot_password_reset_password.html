<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Botanical Hearth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-herb-white': '#F3F6EE',
            'surface-paper': '#FDFBF6',
            'primary-moss': '#2F5233',
            'primary-moss-hover': '#25401F',
            'accent-beetroot': '#A63446',
            'accent-turmeric': '#D9A441',
            'text-charcoal': '#2B2A25',
            'text-stem-gray': '#6B6F63',
            'border-sage-mist': '#DCE3D5',
            'success-sprout': '#4C8C4A',
            'error-chili': '#C1432E'
          },
          fontFamily: {
            serif: ['"Libre Caslon Text"', 'Fraunces', 'Georgia', 'serif'],
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bg-herb-white min-h-screen text-text-charcoal font-sans antialiased flex flex-col justify-center items-center p-4 selection:bg-primary-moss selection:text-white">

  <!-- Main Centered Card Container -->
  <main class="w-full max-w-[480px] bg-surface-paper border border-border-sage-mist rounded-[12px] p-8 sm:p-10 flex flex-col items-center">
    
    <!-- Top Brand Logo -->
    <div class="flex items-center gap-2 mb-6">
      <svg class="w-6 h-6 text-primary-moss stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
      </svg>
      <span class="font-serif text-[22px] font-normal tracking-tight text-primary-moss">Botanical Hearth</span>
    </div>

    <!-- Header Icon -->
    <div class="w-12 h-12 rounded-full bg-bg-herb-white border border-border-sage-mist flex items-center justify-center text-primary-moss mb-4">
      <svg class="w-5 h-5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        <circle cx="12" cy="16" r="1"></circle>
      </svg>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="font-serif text-[28px] leading-tight font-normal text-text-charcoal text-center mb-2">
      Reset Password
    </h1>
    <p class="font-sans text-[14px] text-text-stem-gray text-center leading-relaxed max-w-[340px] mb-8">
      Enter your email and we'll send you a recovery link
    </p>

    <!-- Reset Password Form -->
    <form id="reset-form" class="w-full space-y-5" onsubmit="handleFormSubmit(event)">
      
      <!-- Email Address Input -->
      <div class="space-y-1.5">
        <label for="email" class="block text-[13px] font-medium text-text-charcoal">
          Email Address
        </label>
        <div class="relative">
          <input type="email" id="email" name="email" required="" placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-white border border-border-sage-mist rounded-[8px] text-[15px] text-text-charcoal placeholder:text-text-stem-gray/60 focus:outline-none focus:ring-2 focus:ring-primary-moss focus:border-transparent transition-colors duration-200">
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-1">
        <button type="submit" id="submit-btn" class="w-full min-h-[44px] py-2.5 px-4 bg-primary-moss hover:bg-primary-moss-hover text-white font-medium text-[15px] rounded-[8px] transition-colors duration-200 ease-in-out flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary-moss focus:ring-offset-2 focus:ring-offset-surface-paper">
          <span>Send Recovery Link</span>
        </button>
      </div>

      <!-- Success Notification Box (Initially Hidden) -->
      <div id="success-alert" class="hidden p-3.5 bg-[#E8F0E4] border border-[#C5D8BF] rounded-[8px] text-[13px] text-primary-moss flex items-start gap-2.5 transition-all">
        <svg class="w-4 h-4 mt-0.5 shrink-0 text-success-sprout stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>A password reset link has been dispatched to your email inbox. Please check within 5 minutes.</span>
      </div>

      <!-- Back to Log In Link -->
      <div class="pt-2 text-center">
        <a href="#" class="inline-flex items-center gap-1.5 text-[14px] text-text-stem-gray hover:text-primary-moss transition-colors duration-200 group">
          <svg class="w-4 h-4 stroke-current transition-transform duration-200 group-hover:-translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
          <span>Back to Log In</span>
        </a>
      </div>

    </form>

  </main>

  <script>
    function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const successAlert = document.getElementById('success-alert');
      
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
      submitBtn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Sending Link...</span>
      `;

      setTimeout(() => {
        submitBtn.innerHTML = '<span>Recovery Link Sent</span>';
        successAlert.classList.remove('hidden');
      }, 700);
    }
  </script>


</body></html>
